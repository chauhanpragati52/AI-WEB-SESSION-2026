<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">🔍🧡</div>
            <h1>Khoj-<span>UP</span></h1>
        </div>
        <p class="slogan">Har Bachpan Hai Keemti</p>
    </header>

    <main class="container">
        <section class="form-card">
            <h2>Missing Child Reporting Form</h2>
            <p class="instruction">Please provide accurate details to help local authorities and citizens.</p>

            <form id="missingChildForm">
                <div class="form-group">
                    <label>Child's Full Name</label>
                    <input type="text" id="childName" placeholder="Enter child's name" required>
                </div>

                <div class="form-group">
                    <label>Father's Name</label>
                    <input type="text" id="fatherName" placeholder="Enter father's name" required>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="age" min="0" max="18" required>
                    </div>
                    <div class="form-group">
                        <label>Specific Identification Mark</label>
                        <input type="text" id="sign" placeholder="e.g. Mole on left cheek" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Last Known Address / Missing From</label>
                    <textarea id="address" rows="3" placeholder="Locality, City, District" required></textarea>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Parent Mobile No.</label>
                        <input type="tel" id="mobile" pattern="[0-9]{10}" placeholder="10-digit number" required>
                    </div>
                    <div class="form-group">
                        <label>Reward Money (₹)</label>
                        <input type="number" id="reward" placeholder="If any">
                    </div>
                </div>

                <button type="submit" class="submit-btn">Submit Report</button>
            </form>
        </section>

        <section class="emergency-footer">
            <div class="helpline-box">
                <h3>URGENT HELP?</h3>
                <p>UP Police Child Helpline Number:</p>
                <a href="tel:1098" class="phone-link">1098</a>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
